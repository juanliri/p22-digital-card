<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="officeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person1Suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person2Suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a252f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person3Blazer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person4Suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#191970;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Office background -->
  <rect width="800" height="600" fill="url(#officeGradient)"/>
  
  <!-- Office windows in background -->
  <rect x="50" y="50" width="120" height="200" fill="url(#windowGradient)" opacity="0.7" rx="8"/>
  <rect x="200" y="50" width="120" height="200" fill="url(#windowGradient)" opacity="0.7" rx="8"/>
  <rect x="600" y="50" width="120" height="200" fill="url(#windowGradient)" opacity="0.7" rx="8"/>
  
  <!-- Window frames -->
  <rect x="50" y="50" width="120" height="200" fill="none" stroke="#34495e" stroke-width="3" rx="8"/>
  <line x1="110" y1="50" x2="110" y2="250" stroke="#34495e" stroke-width="2"/>
  <line x1="50" y1="150" x2="170" y2="150" stroke="#34495e" stroke-width="2"/>
  
  <rect x="200" y="50" width="120" height="200" fill="none" stroke="#34495e" stroke-width="3" rx="8"/>
  <line x1="260" y1="50" x2="260" y2="250" stroke="#34495e" stroke-width="2"/>
  <line x1="200" y1="150" x2="320" y2="150" stroke="#34495e" stroke-width="2"/>
  
  <rect x="600" y="50" width="120" height="200" fill="none" stroke="#34495e" stroke-width="3" rx="8"/>
  <line x1="660" y1="50" x2="660" y2="250" stroke="#34495e" stroke-width="2"/>
  <line x1="600" y1="150" x2="720" y2="150" stroke="#34495e" stroke-width="2"/>
  
  <!-- Conference table -->
  <ellipse cx="400" cy="450" rx="250" ry="80" fill="url(#tableGradient)"/>
  <ellipse cx="400" cy="440" rx="250" ry="80" fill="url(#tableGradient)" opacity="0.8"/>
  
  <!-- Documents and materials on table -->
  <rect x="320" y="420" width="40" height="30" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <rect x="440" y="415" width="35" height="25" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <rect x="500" y="425" width="30" height="20" fill="#0066CC" opacity="0.8" rx="2"/>
  
  <!-- Laptops -->
  <rect x="350" y="410" width="25" height="18" fill="#2c3e50" rx="2"/>
  <rect x="352" y="412" width="21" height="14" fill="#34495e" rx="1"/>
  
  <rect x="470" y="408" width="25" height="18" fill="#2c3e50" rx="2"/>
  <rect x="472" y="410" width="21" height="14" fill="#34495e" rx="1"/>
  
  <!-- Team members around the table -->
  
  <!-- Person 1 - Left side (Pedro Felipe style) -->
  <g transform="translate(250, 350)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="35" ry="25" fill="url(#person1Suit)"/>
    <!-- Shirt -->
    <path d="M -15 45 L -8 55 L 0 50 L 8 55 L 15 45 L 8 40 L 0 45 L -8 40 Z" fill="white"/>
    <!-- Tie -->
    <path d="M -4 45 L 4 45 L 3 65 L 0 68 L -3 65 Z" fill="#0066CC"/>
    <!-- Neck -->
    <ellipse cx="0" cy="35" rx="8" ry="12" fill="#d4a574"/>
    <!-- Head -->
    <ellipse cx="0" cy="10" rx="20" ry="25" fill="#d4a574"/>
    <!-- Hair -->
    <ellipse cx="0" cy="-5" rx="22" ry="18" fill="#2c1810"/>
    <!-- Eyes -->
    <circle cx="-7" cy="8" r="2" fill="white"/>
    <circle cx="7" cy="8" r="2" fill="white"/>
    <circle cx="-7" cy="8" r="1.5" fill="#2c3e50"/>
    <circle cx="7" cy="8" r="1.5" fill="#2c3e50"/>
    <!-- Mouth -->
    <path d="M -5 18 Q 0 22 5 18" stroke="#c49464" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Person 2 - Right side -->
  <g transform="translate(550, 350)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="35" ry="25" fill="url(#person2Suit)"/>
    <!-- Shirt -->
    <path d="M -15 45 L -8 55 L 0 50 L 8 55 L 15 45 L 8 40 L 0 45 L -8 40 Z" fill="white"/>
    <!-- Tie -->
    <path d="M -4 45 L 4 45 L 3 65 L 0 68 L -3 65 Z" fill="#FFD700"/>
    <!-- Neck -->
    <ellipse cx="0" cy="35" rx="8" ry="12" fill="#c49464"/>
    <!-- Head -->
    <ellipse cx="0" cy="10" rx="20" ry="25" fill="#c49464"/>
    <!-- Hair -->
    <ellipse cx="0" cy="-5" rx="22" ry="18" fill="#654321"/>
    <!-- Eyes -->
    <circle cx="-7" cy="8" r="2" fill="white"/>
    <circle cx="7" cy="8" r="2" fill="white"/>
    <circle cx="-7" cy="8" r="1.5" fill="#2c3e50"/>
    <circle cx="7" cy="8" r="1.5" fill="#2c3e50"/>
    <!-- Mouth -->
    <path d="M -5 18 Q 0 22 5 18" stroke="#b8845f" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Person 3 - Center back -->
  <g transform="translate(400, 320)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="35" ry="25" fill="url(#person3Blazer)"/>
    <!-- Shirt -->
    <path d="M -15 45 L -8 55 L 0 50 L 8 55 L 15 45 L 8 40 L 0 45 L -8 40 Z" fill="white"/>
    <!-- Neck -->
    <ellipse cx="0" cy="35" rx="8" ry="12" fill="#e8b896"/>
    <!-- Head -->
    <ellipse cx="0" cy="10" rx="20" ry="25" fill="#e8b896"/>
    <!-- Hair (longer, professional) -->
    <ellipse cx="0" cy="-5" rx="22" ry="18" fill="#8B4513"/>
    <path d="M -20 -2 Q -25 5 -18 12" fill="#8B4513"/>
    <path d="M 20 -2 Q 25 5 18 12" fill="#8B4513"/>
    <!-- Eyes -->
    <circle cx="-7" cy="8" r="2" fill="white"/>
    <circle cx="7" cy="8" r="2" fill="white"/>
    <circle cx="-7" cy="8" r="1.5" fill="#2c3e50"/>
    <circle cx="7" cy="8" r="1.5" fill="#2c3e50"/>
    <!-- Mouth -->
    <path d="M -5 18 Q 0 22 5 18" stroke="#d4a574" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Person 4 - Far right -->
  <g transform="translate(650, 370)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="35" ry="25" fill="url(#person4Suit)"/>
    <!-- Shirt -->
    <path d="M -15 45 L -8 55 L 0 50 L 8 55 L 15 45 L 8 40 L 0 45 L -8 40 Z" fill="white"/>
    <!-- Tie -->
    <path d="M -4 45 L 4 45 L 3 65 L 0 68 L -3 65 Z" fill="#8B0000"/>
    <!-- Neck -->
    <ellipse cx="0" cy="35" rx="8" ry="12" fill="#f4c2a1"/>
    <!-- Head -->
    <ellipse cx="0" cy="10" rx="20" ry="25" fill="#f4c2a1"/>
    <!-- Hair -->
    <ellipse cx="0" cy="-5" rx="22" ry="18" fill="#4A4A4A"/>
    <!-- Eyes -->
    <circle cx="-7" cy="8" r="2" fill="white"/>
    <circle cx="7" cy="8" r="2" fill="white"/>
    <circle cx="-7" cy="8" r="1.5" fill="#2c3e50"/>
    <circle cx="7" cy="8" r="1.5" fill="#2c3e50"/>
    <!-- Mouth -->
    <path d="M -5 18 Q 0 22 5 18" stroke="#e8b896" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Company branding on wall -->
  <g transform="translate(400, 150)" opacity="0.6">
    <rect x="-60" y="-20" width="120" height="40" fill="white" stroke="#0066CC" stroke-width="2" rx="8"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066CC">P-22 CORP</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0066CC">Reliable Solutions. Trusted Results.</text>
  </g>
  
  <!-- Professional lighting -->
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="white" opacity="0.1"/>
  
  <!-- Subtle office elements -->
  <g opacity="0.3">
    <!-- Office plants -->
    <ellipse cx="100" cy="500" rx="15" ry="30" fill="#228B22"/>
    <rect x="95" y="500" width="10" height="20" fill="#8B4513"/>
    
    <ellipse cx="700" cy="480" rx="12" ry="25" fill="#228B22"/>
    <rect x="696" y="480" width="8" height="15" fill="#8B4513"/>
    
    <!-- Wall decorations -->
    <rect x="450" y="80" width="60" height="40" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="520" y="90" width="50" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  
  <!-- Professional border -->
  <rect x="5" y="5" width="790" height="590" fill="none" stroke="#e9ecef" stroke-width="3" rx="10"/>
</svg>