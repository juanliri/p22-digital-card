<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="productGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#productGradient)" opacity="0.1"/>
  <circle cx="60" cy="60" r="50" fill="white" stroke="url(#productGradient)" stroke-width="2"/>
  
  <!-- Warehouse/Distribution Center -->
  <g transform="translate(60, 60)">
    <!-- Main building -->
    <rect x="-25" y="5" width="50" height="30" fill="url(#productGradient)"/>
    <polygon points="-25,5 0,-15 25,5" fill="url(#accentGradient)"/>
    
    <!-- Building details -->
    <rect x="-20" y="10" width="8" height="25" fill="white" opacity="0.9"/>
    <rect x="-8" y="10" width="8" height="25" fill="white" opacity="0.9"/>
    <rect x="4" y="10" width="8" height="25" fill="white" opacity="0.9"/>
    <rect x="16" y="10" width="8" height="25" fill="white" opacity="0.9"/>
    
    <!-- Loading dock -->
    <rect x="25" y="15" width="15" height="20" fill="url(#productGradient)" opacity="0.8"/>
    <rect x="27" y="17" width="11" height="16" fill="white"/>
    
    <!-- Electrical symbols -->
    <g transform="translate(-35, -10)">
      <!-- Lightning bolt -->
      <path d="M 0 -8 L 4 -8 L 1 0 L 6 0 L 2 8 L -2 0 L -4 0 Z" fill="url(#accentGradient)"/>
    </g>
    
    <g transform="translate(35, -10)">
      <!-- Gear/mechanical -->
      <circle cx="0" cy="0" r="6" fill="url(#accentGradient)"/>
      <circle cx="0" cy="0" r="3" fill="white"/>
      <rect x="-1" y="-8" width="2" height="4" fill="url(#accentGradient)"/>
      <rect x="-1" y="4" width="2" height="4" fill="url(#accentGradient)"/>
      <rect x="-8" y="-1" width="4" height="2" fill="url(#accentGradient)"/>
      <rect x="4" y="-1" width="4" height="2" fill="url(#accentGradient)"/>
    </g>
    
    <!-- Supply boxes/materials -->
    <g transform="translate(-15, -25)">
      <rect x="0" y="0" width="8" height="6" fill="url(#accentGradient)" opacity="0.8"/>
      <rect x="0" y="0" width="8" height="2" fill="url(#accentGradient)"/>
    </g>
    
    <g transform="translate(-5, -25)">
      <rect x="0" y="0" width="8" height="6" fill="url(#productGradient)" opacity="0.8"/>
      <rect x="0" y="0" width="8" height="2" fill="url(#productGradient)"/>
    </g>
    
    <g transform="translate(5, -25)">
      <rect x="0" y="0" width="8" height="6" fill="url(#accentGradient)" opacity="0.8"/>
      <rect x="0" y="0" width="8" height="2" fill="url(#accentGradient)"/>
    </g>
    
    <!-- Delivery truck -->
    <g transform="translate(0, 40)">
      <rect x="-12" y="-3" width="24" height="8" rx="4" fill="url(#productGradient)"/>
      <circle cx="-6" cy="6" r="3" fill="url(#productGradient)"/>
      <circle cx="6" cy="6" r="3" fill="url(#productGradient)"/>
      <rect x="-10" y="-6" width="6" height="3" rx="1" fill="url(#accentGradient)"/>
    </g>
  </g>
</svg>