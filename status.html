<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="P-22 Corp live stack status dashboard: site, APIs, integrations, config and failover.">
<meta name="theme-color" content="#060B14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>P-22 Stack Status | 360° Live Dashboard</title>
<style>
  :root{--bg:#060B14;--card:#0d1626;--line:rgba(255,255,255,.08);--txt:#e8eefc;--mut:#8b9bb8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--gold:#C9A227}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#12213f,transparent),var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));min-height:100dvh}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 18px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  h1 small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
  .pill{padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card)}
  .pill.ok{color:var(--ok);border-color:rgba(34,197,94,.4);box-shadow:0 0 18px rgba(34,197,94,.2)}
  .pill.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}
  .pill.bad{color:var(--bad);border-color:rgba(239,68,68,.5);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 22px rgba(239,68,68,.5)}}
  .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .row:first-of-type{border-top:0}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--bad)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .mut{color:var(--mut);font-size:11px;white-space:nowrap}
  .meta{max-width:1100px;margin:14px auto 0;color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
  button,a.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;text-decoration:none}
  .links{max-width:1100px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>P-22 Stack Status<small id="sub">Connecting…</small></h1>
  <div id="overall" class="pill">Checking…</div>
</header>
<main id="grid" class="grid" aria-live="polite"></main>
<div class="meta"><span id="stamp"></span><span id="counts"></span><span>Auto-refresh 30s</span></div>
<nav class="links" aria-label="Quick admin links">
  <button id="refreshBtn" type="button">Refresh now</button>
  <a class="btn" href="https://vercel.com/todobuild-apps/p22-digital-card" target="_blank" rel="noopener">Vercel project</a>
  <a class="btn" href="https://vercel.com/todobuild-apps/p22-digital-card/settings/billing" target="_blank" rel="noopener">Vercel usage</a>
  <a class="btn" href="https://github.com/juanliri/p22-digital-card/actions" target="_blank" rel="noopener">GitHub Actions</a>
  <a class="btn" href="https://docs.google.com/spreadsheets/d/1Xfwmr7iPtV3YaAO6GIJW-Ekx5WM1sR92YZGnD2Qubl0" target="_blank" rel="noopener">Leads Sheet</a>
  <a class="btn" href="/setup">Staff Setup Hub</a>
</nav>
<script>
const grid=document.getElementById('grid');
async function load(){
  try{
    const t0=performance.now();
    const r=await fetch('/api/status',{cache:'no-store'});
    const d=await r.json();
    const lat=Math.round(performance.now()-t0);
    const o=document.getElementById('overall');
    o.textContent=d.overall;
    o.className='pill '+(d.overall==='OPERATIONAL'?'ok':d.overall==='DEGRADED'?'warn':'bad');
    document.getElementById('sub').textContent=`Deploy ${d.deployment} · region ${d.region} · API ${lat}ms`;
    document.getElementById('stamp').textContent='Checked '+new Date(d.checkedAt).toLocaleTimeString();
    document.getElementById('counts').textContent=`${d.summary.passing}/${d.summary.total} passing`;
    const groups={};
    d.checks.forEach(c=>(groups[c.group]=groups[c.group]||[]).push(c));
    grid.innerHTML=Object.entries(groups).map(([g,items])=>`<section class="card"><h2>${g}</h2>${items.map(c=>`<div class="row"><span><span class="dot ${c.ok?'ok':''}"></span>${c.name}</span><span class="mut">${c.detail||''}${c.ms!=null?' · '+c.ms+'ms':''}</span></div>`).join('')}</section>`).join('');
  }catch(e){
    const o=document.getElementById('overall');o.textContent='API UNREACHABLE';o.className='pill bad';
    document.getElementById('sub').textContent='Primary host not answering - open the failover mirror (see runbook).';
  }
}
document.getElementById('refreshBtn').onclick=load;
load();setInterval(load,30000);
</script>
</body>
</html>
